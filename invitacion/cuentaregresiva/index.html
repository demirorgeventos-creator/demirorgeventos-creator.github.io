<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta regresiva | DEMIR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--arena:#e9dfd1;--blanco:#fffefa;--beige:#d8c9b7;--cafe:#6b5141;--cafe-suave:#927966;--linea:#e5d9cc}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:transparent}
body{padding:10px;color:var(--cafe);font-family:Montserrat,Arial,sans-serif}
.countdown{width:100%;max-width:620px;margin:0 auto;padding:clamp(20px,5vw,34px) clamp(14px,4vw,28px);text-align:center;background:var(--blanco);border:1px solid var(--linea);box-shadow:0 8px 26px rgba(107,81,65,.07)}
.eyebrow{margin:0 0 7px;color:var(--cafe-suave);font:500 10px Montserrat,sans-serif;letter-spacing:3px;text-transform:uppercase}
h1{margin:0;color:var(--cafe);font:500 clamp(27px,6vw,38px) 'Cormorant Garamond',Georgia,serif;line-height:1.1}
.date{margin:10px 0 22px;color:var(--cafe-suave);font:400 12px Montserrat,sans-serif;letter-spacing:1px}
.rule{width:min(110px,35%);height:1px;margin:0 auto 22px;background:var(--beige)}
.units{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(7px,2vw,16px)}
.unit{min-width:0;padding:13px 5px 11px;background:var(--arena);border:1px solid rgba(216,201,183,.55)}
.number{display:block;color:var(--cafe);font:500 clamp(27px,7vw,43px) 'Cormorant Garamond',Georgia,serif;line-height:1;font-variant-numeric:tabular-nums}
.label{display:block;margin-top:8px;color:var(--cafe-suave);font:500 clamp(8px,1.8vw,10px) Montserrat,sans-serif;letter-spacing:1px;text-transform:uppercase}
.message{min-height:22px;margin:20px 0 0;color:var(--cafe-suave);font:400 14px 'Cormorant Garamond',Georgia,serif;letter-spacing:.3px}
@media(max-width:360px){body{padding:5px}.units{gap:5px}.unit{padding:12px 2px 10px}.label{letter-spacing:.5px}}
</style>
</head>
<body>
<main class="countdown" aria-live="off">
<p class="eyebrow">El gran día se acerca</p>
<h1>Cuenta regresiva</h1>
<div class="rule"></div>
<section class="units" aria-label="Tiempo restante">
<div class="unit"><span class="number" id="days">000</span><span class="label">Días</span></div>
<div class="unit"><span class="number" id="hours">00</span><span class="label">Horas</span></div>
<div class="unit"><span class="number" id="minutes">00</span><span class="label">Minutos</span></div>
<div class="unit"><span class="number" id="seconds">00</span><span class="label">Segundos</span></div>
</section>
<p class="message" id="message">Cada instante nos acerca a celebrar juntos.</p>
</main>
<script>
const params=new URLSearchParams(location.search);
const fecha=params.get('fecha')||'2027-03-20';
const hora=params.get('hora')||'15:30';
const target=new Date(`${fecha}T${hora}:00-07:00`).getTime();
const pad=n=>String(n).padStart(2,'0');
function updateCountdown(){
 let rest=target-Date.now();
 if(rest<=0){
  ['days','hours','minutes','seconds'].forEach(id=>document.getElementById(id).textContent='00');
  document.getElementById('message').textContent=rest>-86400000?'¡Hoy es el gran día!':'Gracias por ser parte de este momento.';
  return;
 }
 const d=Math.floor(rest/86400000);rest%=86400000;
 const h=Math.floor(rest/3600000);rest%=3600000;
 const m=Math.floor(rest/60000);const s=Math.floor((rest%60000)/1000);
 document.getElementById('days').textContent=String(d).padStart(3,'0');
 document.getElementById('hours').textContent=pad(h);
 document.getElementById('minutes').textContent=pad(m);
 document.getElementById('seconds').textContent=pad(s);
}
updateCountdown();setInterval(updateCountdown,1000);
</script>
</body>
</html>
