<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu invitación</title>
    <link rel="stylesheet" href="style.css">

    <!-- Vista previa al compartir el link (WhatsApp, etc.) -->
    <meta property="og:title" content="Tienes una invitación especial 💌">
    <meta property="og:description" content="Toca para abrir tu invitación">
    <meta property="og:image" content="https://demir.com.mx/invitacion/recursos/preview.jpg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body>

    <main class="intro">

        <!-- =========================
             SOBRE
        ========================== -->

        <div class="sobre" id="sobre">

            <div class="solapa"></div>

            <div class="cuerpo-sobre"></div>

            <button
                class="sello"
                id="sello"
                aria-label="Abrir invitación">

                <img
                    src="recursos/sello.png"
                    alt="Abrir invitación">

                <span class="sello-loader" id="selloLoader"></span>

            </button>

        </div>


        <!-- =========================
             TARJETA PERSONALIZADA
        ========================== -->

        <div
            class="tarjeta-container"
            id="tarjetaContainer">

            <div class="tarjeta">

                <div class="tarjeta-linea"></div>

                <div
                    class="nombre-invitado"
                    id="nombreInvitado">
                    Cargando...
                </div>

                <div class="texto-pase">
                    Tu pase es para
                </div>

                <div
                    class="numero-pase"
                    id="numeroPase">
                </div>

                <button
                    class="abrir-invitacion"
                    id="abrirInvitacion">
                    ABRIR INVITACIÓN
                </button>

            </div>

        </div>


        <!-- =========================
             VIDEO
        ========================== -->

        <div
            class="video-container"
            id="videoContainer">

            <video id="video" playsinline webkit-playsinline preload="auto">
                <source
                    src="recursos/video.mp4"
                    type="video/mp4">

                Tu navegador no puede reproducir este video.
            </video>

            <button
                class="tap-continuar"
                id="tapContinuar"
                style="display:none;">
                Toca para continuar
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
