<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reproductor DEMIR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>  <div class="player">
    <p class="player-title">Nuestra canción</p><audio id="musica" preload="metadata">
  <source src="recursos/cancion.mp3" type="audio/mpeg">
</audio>

<div class="player-controls">

  <button id="controlMusica" class="play-button" type="button" aria-label="Reproducir música">
    <svg class="icon-play" viewBox="0 0 24 24">
      <path d="M7 4.5 L19 12 L7 19.5 Z"/>
    </svg>

    <svg class="icon-pause" viewBox="0 0 24 24">
      <path d="M6 4 H10 V20 H6 Z M14 4 H18 V20 H14 Z"/>
    </svg>
  </button>

  <div class="timeline">
    <input type="range" id="progreso" min="0" max="100" value="0" step="0.1">

    <div class="time-labels">
      <span id="tiempoActual">00:00</span>
      <span id="duracion">00:00</span>
    </div>
  </div>

  <div class="volume-control">
    <svg viewBox="0 0 24 24">
      <path d="M3 9 V15 H7 L12 19 V5 L7 9 Z"/>
      <path d="M16 9 A5 5 0 0 1 16 15"/>
      <path d="M18.5 6.5 A8.5 8.5 0 0 1 18.5 17.5"/>
    </svg>

    <input type="range" id="volumen" min="0" max="1" value="1" step="0.01">
  </div>

</div>

  </div>  <script src="script.js"></script></body>
</html>
