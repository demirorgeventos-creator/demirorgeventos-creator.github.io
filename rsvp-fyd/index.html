<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEMIR · Confirmación de asistencia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--vino:#6B2D3E;--oscuro:#4A1C2A;--dorado:#C9A84C;--crema:#FAF6F0;--verde:#2D6B4A;--rojo:#C0392B;--borde:#e9e0d8}
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;background:transparent}body{font-family:Montserrat,Arial,sans-serif;color:#34242a;padding:10px}
.shell{width:100%;max-width:560px;margin:0 auto;background:var(--crema);border:1px solid var(--borde);padding:clamp(18px,4vw,30px);box-shadow:0 8px 28px #4a1c2a14}
.head{text-align:center;margin-bottom:22px}.brand{font:15px 'Cormorant Garamond',serif;letter-spacing:5px;color:var(--dorado);margin-bottom:8px}.title{font:500 clamp(25px,5vw,32px) 'Cormorant Garamond',serif;color:var(--oscuro)}.sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#927d7d;margin-top:6px}.divider{height:1px;background:linear-gradient(90deg,transparent,var(--dorado),transparent);margin:18px 0 22px}
.person{background:#fff;border:1px solid var(--borde);padding:16px;margin:12px 0}.person-name{font:22px 'Cormorant Garamond',serif;color:var(--oscuro);margin-bottom:8px;overflow-wrap:anywhere}.status{font-size:10px;letter-spacing:.5px;margin-bottom:13px;font-weight:600}.pending{color:#8a6d00}.yes-status{color:var(--verde)}.no-status{color:var(--rojo)}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{font-family:Montserrat,Arial,sans-serif;cursor:pointer}.choice{min-height:44px;padding:11px 8px;border:1px solid var(--vino);background:#fff;color:var(--vino);font-size:10px;font-weight:600;letter-spacing:.4px}.choice.yes{background:var(--verde);border-color:var(--verde);color:#fff}.choice.no{border-color:var(--rojo);color:var(--rojo)}.choice:disabled{opacity:.55;cursor:wait}.notice,.message{text-align:center;font-size:11px;line-height:1.7;color:#806f70;margin-top:16px}.loading{text-align:center;padding:22px 10px;font-size:12px}.spinner{width:25px;height:25px;border:2px solid #eadfda;border-top-color:var(--vino);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}.error-title{font:23px 'Cormorant Garamond',serif;color:var(--oscuro);margin-bottom:6px}.hidden{display:none!important}
@media(max-width:360px){.buttons{grid-template-columns:1fr}.choice{min-height:40px}}
</style></head>
<body><section class="shell" aria-live="polite">
<header class="head"><div class="brand">DEMIR</div><div class="title">Confirmación de asistencia</div><div class="sub" id="subtitle">Nos encantará contar contigo</div></header><div class="divider"></div>
<div id="loading" class="loading"><div class="spinner"></div>Preparando tu confirmación…</div><div id="content" class="hidden"></div>
<div id="error" class="message hidden"><div class="error-title">No pudimos localizar tu invitación</div>Verifica que hayas ingresado desde el enlace personal que te compartieron.</div>
<div id="fatal" class="message hidden"><div class="error-title">No fue posible cargar la confirmación</div>Intenta nuevamente en unos minutos.</div>
</section>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {getDatabase,ref,get,update,push} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyB45I1lwpPZmUJxFB5hu_xtXAwX709PPxc',authDomain:'demirqr-cb84d.firebaseapp.com',databaseURL:'https://demirqr-cb84d-default-rtdb.firebaseio.com',projectId:'demirqr-cb84d',storageBucket:'demirqr-cb84d.appspot.com',messagingSenderId:'172090319379',appId:'1:172090319379:web:b9577cb84f0e6c2c4495e6'};
const db=getDatabase(initializeApp(firebaseConfig));
// Lee parámetros directos; como alternativa intenta leerlos del referrer (si el navegador los envía).
function params() {
  const q = new URLSearchParams(location.search);

  let id = q.get('id');
  let evento = q.get('evento');

  // 1. Intentar leer los parámetros directamente.
  if (id && evento) {
    try {
      localStorage.setItem('demir_rsvp_context', JSON.stringify({
        id,
        evento,
        guardadoEn: Date.now()
      }));
    } catch (e) {}

    return { id, evento };
  }

  // 2. Intentar recuperar el contexto guardado.
  try {
    const raw = localStorage.getItem('demir_rsvp_context');

    if (raw) {
      const saved = JSON.parse(raw);
      const age = Date.now() - Number(saved.guardadoEn || 0);

      const valid =
        saved.id &&
        saved.evento &&
        age >= 0 &&
        age <= 24 * 60 * 60 * 1000;

      if (valid) {
        return {
          id: saved.id,
          evento: saved.evento
        };
      }

      localStorage.removeItem('demir_rsvp_context');
    }
  } catch (e) {
    console.warn('No se pudo recuperar el contexto RSVP.', e);
  }

  // 3. Último intento: recuperar los parámetros del referrer.
  if (document.referrer) {
    try {
      const r = new URL(document.referrer);

      id = r.searchParams.get('id');
      evento = r.searchParams.get('evento');
    } catch (e) {}
  }

  return { id, evento };
}
const {id:invId,evento:eventoId}=params();let personas={},invitado={};const $=id=>document.getElementById(id);const ruta=()=>`invitados/${eventoId}/${invId}`;const hide=id=>$(id).classList.add('hidden');
function error(){hide('loading');hide('content');$('error').classList.remove('hidden')}function fatal(e){console.error('DEMIR RSVP',e);hide('loading');hide('content');$('fatal').classList.remove('hidden')}
async function start(){if(!invId||!eventoId){error();return}try{const [evS,invS]=await Promise.all([get(ref(db,`eventos/${eventoId}`)),get(ref(db,ruta()))]);if(!evS.exists()||!invS.exists()){error();return}invitado=invS.val();if(evS.val().confirmacionIndividual===true){await preparePeople();renderPeople()}else renderGroup();hide('loading');$('content').classList.remove('hidden')}catch(e){fatal(e)}}
// Misma estructura de personas que utiliza el pase DEMIR; solo crea registros si faltan.
async function preparePeople(){personas=invitado.personas&&typeof invitado.personas==='object'?{...invitado.personas}:{};if(!Object.keys(personas).length){const names=(invitado.acompanantes||'').split(',').map(n=>n.trim()).filter(Boolean);const adults=Math.max(Number(invitado.adultos)||(1+names.length),1+names.length);const titular=push(ref(db,`${ruta()}/personas`)).key;personas[titular]={nombre:invitado.nombre||'',tipo:'titular',respuesta:null};names.forEach(nombre=>{const key=push(ref(db,`${ruta()}/personas`)).key;personas[key]={nombre,tipo:'acompanante',respuesta:null}});for(let i=0;i<adults-1-names.length;i++){const key=push(ref(db,`${ruta()}/personas`)).key;personas[key]={nombre:'',tipo:'acompanante_sin_nombre',respuesta:null}}await update(ref(db,ruta()),{personas});invitado.personas=personas}else if(!Object.values(personas).some(p=>p&&p.tipo==='titular'&&p.activo!==false)){const key=push(ref(db,`${ruta()}/personas`)).key;personas[key]={nombre:invitado.nombre||'',tipo:'titular',respuesta:null};await update(ref(db,ruta()),{personas})}}
function button(label,cls,fn){const b=document.createElement('button');b.type='button';b.className=`choice ${cls}`;b.textContent=label;b.addEventListener('click',fn);return b}
function renderPeople(){ $('subtitle').textContent='Confirma la asistencia de cada adulto';const box=$('content');box.innerHTML='';Object.entries(personas).forEach(([pid,p])=>{if(!p||p.activo===false)return;const answer=p.respuesta||'pendiente',card=document.createElement('article');card.className='person';const name=document.createElement('div');name.className='person-name';name.textContent=p.nombre||(p.tipo==='titular'?(invitado.nombre||'Titular'):'Acompañante');const status=document.createElement('div');status.className='status '+(answer==='confirmado'?'yes-status':answer==='declinado'?'no-status':'pending');status.textContent=answer==='confirmado'?'✓ Asistencia confirmada':answer==='declinado'?'✕ No asistirá':'Pendiente de respuesta';const actions=document.createElement('div');actions.className='buttons';const yes=button('Sí asistiré','yes',()=>answerPerson(pid,'confirmado'));const no=button('No podré asistir','no',()=>answerPerson(pid,'declinado'));yes.disabled=busy.has(pid)&&answer==='confirmado';no.disabled=busy.has(pid)&&answer==='declinado';actions.append(yes,no);card.append(name,status,actions);box.append(card)});const note=document.createElement('p');note.className='notice';note.textContent='Si necesitas cambiar alguna respuesta, puedes seleccionar la otra opción.';box.append(note)}
const busy=new Set();async function answerPerson(pid,value){if(busy.has(pid))return;const p=personas[pid];if(!p||p.activo===false)return;busy.add(pid);renderPeople();const now=Date.now(),historyId=push(ref(db,`${ruta()}/historialRespuestas`)).key;const answers=Object.entries(personas).filter(([k,v])=>v&&v.activo!==false).map(([k,v])=>k===pid?value:(v.respuesta||'pendiente'));let summary='pendiente';if(answers.length&&answers.every(x=>x==='confirmado'))summary='confirmado';else if(answers.length&&answers.every(x=>x==='declinado'))summary='declinado';const changes={};changes[`personas/${pid}/respuesta`]=value;changes[`personas/${pid}/respondidoEn`]=now;changes[`personas/${pid}/ultimaRespuestaEn`]=now;changes[`historialRespuestas/${historyId}`]={personaId:pid,nombre:p.nombre||(p.tipo==='titular'?(invitado.nombre||'Titular'):'Acompañante'),respuestaAnterior:p.respuesta||null,respuesta:value,fecha:now};changes.rsvp=summary;try{await update(ref(db,ruta()),changes);p.respuesta=value;p.respondidoEn=now;invitado.rsvp=summary}catch(e){console.error(e);alert('No pudimos guardar tu respuesta. Intenta nuevamente.')}finally{busy.delete(pid);renderPeople()}}
function renderGroup(){ $('subtitle').textContent='¿Nos acompañarás?';const box=$('content');box.innerHTML='';const answer=invitado.rsvp||'pendiente',status=document.createElement('div');status.className='status '+(answer==='confirmado'?'yes-status':answer==='declinado'?'no-status':'pending');status.style.textAlign='center';status.textContent=answer==='confirmado'?'✓ Asistencia confirmada':answer==='declinado'?'✕ No asistirá':'Pendiente de respuesta';const actions=document.createElement('div');actions.className='buttons';const yes=button('Sí asistiré','yes',()=>answerGroup('confirmado'));const no=button('No podré asistir','no',()=>answerGroup('declinado'));yes.disabled=answer==='confirmado';no.disabled=answer==='declinado';actions.append(yes,no);box.append(status,actions)}
async function answerGroup(value){try{await update(ref(db,ruta()),{rsvp:value});invitado.rsvp=value;renderGroup()}catch(e){console.error(e);alert('No pudimos guardar tu respuesta. Intenta nuevamente.')}}
start();
</script></body></html>
